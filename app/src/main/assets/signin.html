<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}#btn{display:flex;justify-content:center;padding:4px 0}</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<div id="btn"></div>
<script>
// served by the app at the portal origin so google's client id accepts it.
// mode=button renders google's own button and waits for a tap, so signing out actually sticks.
// mode=silent only tries one tap auto sign-in, that's the hidden re-auth.
const q = new URLSearchParams(location.search);
const silent = q.get('mode') === 'silent';
const send = o => { try { jportal.postMessage(JSON.stringify(o)); } catch (e) {} };
function boot(tries) {
  if (!(window.google && google.accounts && google.accounts.id)) {
    if (tries > 150) return send({ type: 'fail', why: 'gsi_not_loaded' });
    return setTimeout(() => boot(tries + 1), 100);
  }
  google.accounts.id.initialize({
    client_id: q.get('cid'),
    callback: r => send({ type: 'credential', credential: r.credential, by: r.select_by }),
    ux_mode: 'popup', auto_select: silent, itp_support: true, cancel_on_tap_outside: false,
    use_fedcm_for_prompt: false, use_fedcm_for_button: false,
  });
  if (!silent) {
    google.accounts.id.renderButton(document.getElementById('btn'), {
      theme: q.get('theme') === 'dark' ? 'filled_black' : 'outline',
      size: 'large', shape: 'pill', text: 'continue_with', logo_alignment: 'left',
      width: Math.min(400, Number(q.get('w')) || 320),
    });
    return send({ type: 'ready' });
  }
  google.accounts.id.prompt(n => {
    const f = k => { try { return n[k] && n[k](); } catch (e) { return null; } };
    if (f('isNotDisplayed') || f('isSkippedMoment')) send({ type: 'no_auto', why: f('getNotDisplayedReason') || f('getSkippedReason') });
  });
}
boot(0);
</script>
</body>
</html>
